<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Анимации HR-портала — демо</title>
  <link rel="stylesheet" href="../text-reveal/text-reveal.css">
  <link rel="stylesheet" href="../loader/loader.css">
  <style>
    :root { --bg: #003da5; --bg-opacity: rgba(255,255,255,.1); --bg-opacity-hover: rgba(255,255,255,.2); --txt: #fff; --txt-70: rgba(255,255,255,.7); }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(120% 90% at 70% 30%, #0a4cc4 0%, var(--bg) 55%, #002f86 100%) fixed;
      color: var(--txt);
      font: 16px/24px "SF Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: -0.5px;
    }
    .page { max-width: 940px; margin: 0 auto; padding: 72px 16px 80px; }
    .label { margin: 0 0 16px; color: var(--txt-70); font-size: 13px; line-height: 20px; text-transform: uppercase; letter-spacing: 0; }
    section + section { margin-top: 64px; }
    h1 {
      margin: 0;
      font-family: "GPN_DIN", "DIN Pro", Arial, sans-serif;
      font-weight: 500;
      font-size: 48px;
      line-height: 1.1;
      letter-spacing: -0.96px;
    }
    .stage {
      height: 200px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: var(--bg-opacity);
    }
    .controls { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
    button, input {
      height: 40px; padding: 0 16px; border: 0; border-radius: 20px;
      background: var(--bg-opacity); color: inherit; font: inherit; cursor: pointer;
    }
    button:hover { background: var(--bg-opacity-hover); }
    input { flex: 1 1 260px; min-width: 0; cursor: text; }
    input::placeholder { color: var(--txt-70); }
    @media (max-width: 600px) { h1 { font-size: 32px; letter-spacing: -0.64px; } }
  </style>
</head>
<body>
  <main class="page">
    <section>
      <p class="label">Анимация заголовка</p>
      <h1 id="title">С первым рабочим днем, Александр!</h1>
      <div class="controls">
        <button type="button" id="replay">↻ Повторить</button>
        <input type="text" id="custom" placeholder="Свой текст + Enter">
      </div>
    </section>

    <section>
      <p class="label">Лоадер</p>
      <div class="stage" id="stage">
        <div class="loader" role="status" aria-live="polite">
          <span class="loader__dot" aria-hidden="true"></span>
          <span class="loader__dot" aria-hidden="true"></span>
          <span class="loader__dot" aria-hidden="true"></span>
          <span class="loader__label">Загрузка</span>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { textReveal } from "../text-reveal/text-reveal.js"

    const title = document.getElementById("title")
    let instance = null

    function start(text) {
      instance?.destroy()
      if (text) title.textContent = text
      instance = textReveal(title)
    }

    document.fonts.ready.then(() => start())
    document.getElementById("replay").addEventListener("click", () => start())
    document.getElementById("custom").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && e.target.value.trim()) start(e.target.value.trim())
    })
  </script>
</body>
</html>
